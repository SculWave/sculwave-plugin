# ==========================================
# SculWave Configuration
# ==========================================
# Your unique activation key from the SculWave Dashboard.
# The plugin will automatically generate and cache the
# instance ID and backend ID after successful activation.

# SculWave backend URL
server-url: "https://sculwave.com"
#url to your self-hosted sculwave server if you're not using the sculwave cloud service


activation-key: ""

# Automatically managed by SculWave.
# Do not edit these values manually.
instance-id: ""
backend-id: ""

# Enables or disables voice chat for this Minecraft server.
#
# true  - Players receive LiveKit voice and can communicate.
# false - Players remain connected to the SculWave network and
#         automatic server switching still works, but no voice
#         session is created while they are on this server.
#
# This is useful for hubs, lobbies, AFK servers, minigames,
# or any server where voice chat should be disabled.
voice-enabled: true

#entry-point: false — normal backend by default.
#entry-point: true — advertise this backend as a network entry point.
#entry-point-priority: 1 — preferred entry point; 2, 3, etc. are fallbacks.
#

entry-point: false
entry-point-priority: 1



# ==========================================
# Simple Voice Chat Bridge
# ==========================================
# When the Simple Voice Chat plugin is installed, players using its mod and players using the
# SculWave app hear each other. Proximity, groups (/vc), /vm mute and voice bans all apply to both.
# Has no effect if Simple Voice Chat is not installed.
svc-bridge:
  enabled: true

  # Forward Simple Voice Chat whispers to app players.
  # Off by default: app players hear within SculWave's own proximity range, which is much wider
  # than a whisper.
  forward-whispers: false

  # How far (in blocks) Simple Voice Chat players hear app players.
  # 0 = use Simple Voice Chat's own configured voice distance.
  distance: 0

# ==========================================
# Voice HUD
# ==========================================
# Action-bar HUD for players using the SculWave app (Java or Bedrock): your own mic status
# (Speaking / Mic on / Muted) plus your group members. Players on the Simple Voice Chat mod
# are skipped, the mod has its own HUD. Players toggle it with /vc hud [on|off].
hud:
  enabled: true
  # How often the HUD is refreshed, in ticks (20 ticks = 1 second).
  update-ticks: 4
  # Show your /vc group members.
  show-group: true
  # Java players: show group members as player heads (needs a 1.21.9+ client).
  # Bedrock players always get a coloured dot and name instead, heads cannot be shown there.
  heads: true
  # Java players: also print names next to the heads.
  java-names: false
  # Most group members shown before "+N".
  max-members: 6

  # Mic icons instead of coloured dots. Needs the icon packs (see README).
  # Bedrock: turn on once SculWave-Bedrock-icons.mcpack is in Geyser's "packs" folder.
  bedrock-icons: false
  # Java: players are offered the pack on join; they see icons once it has loaded, dots until then.
  # Host SculWave-Java-icons-pack.zip somewhere with a direct download link and put the link and its
  # SHA-1 here. Leave the url empty to not offer a pack.
  java-pack:
    url: ""
    sha1: ""

# ==========================================
# Voice Moderation
# ==========================================

# UUIDs of players permanently banned from using SculWave voice.
# Managed automatically by in-game moderation commands.

voice-bans: []

# ==========================================
# Sound Effects
# ==========================================

sounds:
  enabled: true

  join: entity.player.levelup
  leave: entity.experience_orb.pickup
  invite: block.note_block.chime
  invite-sent: block.note_block.bell
  kick: entity.villager.no
  transfer: ui.toast.challenge_complete

# ==========================================
# Debug
# ==========================================

# Enables additional diagnostic logging.
debug: false  # also prints Simple Voice Chat bridge details every minute