name: SculWave
version: '${version}'

main: org.nxblack.sculwave.SculWave
api-version: '26.1'
# Load after Simple Voice Chat (if installed) so the voice bridge can register with it.
softdepend: [voicechat]
commands:
  voice:
    description: SculWave voice commands
    aliases: [vc]
  vm:
    description: Toggle your voice mute
permissions:
  sculwave.admin:
    description: Allows administrative SculWave commands
    default: op
folia-supported: true